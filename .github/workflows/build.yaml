name: Build

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch: {}

jobs:
  build-sdist: 
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.build.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - name: Export version
        id: version
        run: |
          version=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build sdist
        id: build
        run: |
          pip install build
          python -m build --sdist
          echo "file=$(basename dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-vszip-sdist
          path: dist/*.tar.gz

  check-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-sdist
    outputs:
      exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: mukunku/tag-exists-action@v1.7.0
        id: check-tag
        with:
          tag: ${{ needs.build-sdist.outputs.version }}

  build-wheel:
    if: needs.check-tag.outputs.exists == 'false'
    runs-on: ubuntu-latest
    needs:
      - build-sdist
      - check-tag
    strategy:
      matrix:
        target:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-macos
          - x86_64-macos
          - x86_64-windows
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vapoursynth-vszip-sdist
          path: sdist

      - name: Build wheel
        env:
          ZTARGET: ${{ matrix.target }}
        run: |
          pip wheel --no-deps -w dist sdist/${{ needs.build-sdist.outputs.file }}

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-vszip-${{ matrix.target }}
          path: dist/*.whl

  build-avisynth:
    runs-on: ubuntu-latest
    needs: build-sdist
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build avszip.dll
        run: |
          for variant in sse2:x86_64 avx2:haswell avx512:x86_64_v4; do
            name=${variant%%:*}
            cpu=${variant#*:}
            zig build -Doptimize=fast -Dtarget=x86_64-windows -Dcpu=$cpu -Davisynth=true -Dvapoursynth=false --prefix out/$name
            mkdir -p pkg/$name
            cp out/$name/bin/avszip.dll pkg/$name/
          done
          cp LICENSE pkg/
          cd pkg && zip -r ../avszip-${{ needs.build-sdist.outputs.version }}-x86_64-windows.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: avszip-x86_64-windows
          path: avszip-*.zip

  release:
    if: needs.check-tag.outputs.exists == 'false'
    runs-on: ubuntu-latest
    needs:
      - check-tag
      - build-sdist
      - build-wheel
      - build-avisynth
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: vapoursynth-vszip-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: avszip-x86_64-windows
          path: avisynth

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-sdist.outputs.version }}
          files: avisynth/*.zip

      - uses: pypa/gh-action-pypi-publish@release/v1
